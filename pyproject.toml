[project]
name = "petbowl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sundarm710", email = "sundar.m710@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
]

[project.scripts]
petbowl = "petbowl:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","B","UP","SIM"]

[tool.mypy]
strict = true
    
[tool.pytest.ini_options]
addopts = "-q --cov=petbowl --cov-report=term-missing"
