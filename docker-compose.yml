services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: petbowl
      POSTGRES_PASSWORD: petbowl
      POSTGRES_DB: petbowl
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petbowl"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata: