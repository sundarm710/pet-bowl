name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_LOCKED: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: petbowl
          POSTGRES_PASSWORD: petbowl
          POSTGRES_DB: petbowl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petbowl"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: make ci
      